<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Manager</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Apply persisted language synchronously to avoid an RTL/LTR flash.
      try {
        var raw = localStorage.getItem("tm-language");
        var lang = "ar";
        if (raw) {
          var parsed = JSON.parse(raw);
          var stored = parsed && parsed.state && parsed.state.language;
          if (stored === "en" || stored === "ar") lang = stored;
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
